<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>WEINERVILLESTORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nero:#0D0A12;        /* nero-viola di fondo */
    --card:#1A1226;        /* viola scurissimo delle card */
    --viola:#8B5FC7;       /* viola del logo */
    --viola-chiaro:#B98FE8;
    --chrome:#C9CCD6;      /* argento chrome */
    --bianco:#F2F0F7;
  }
  html{color-scheme:dark;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--nero);
    color:var(--bianco);
    font-family:'Space Mono',monospace;
    overflow-x:hidden;
  }
  body.bloccato{overflow:hidden;}

  /* ---- INGRESSO ---- */
  #ingresso{
    position:fixed;inset:0;z-index:500;
    background:var(--nero);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;
    transition:opacity .5s;
    perspective:900px;
    touch-action:none;
  }
  #ingresso.chiuso{opacity:0;pointer-events:none;}
  #logo-spin{
    width:min(82vw,540px);
    cursor:grab;
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
    will-change:transform;
    transform-style:preserve-3d;
  }
  #logo-spin:active{cursor:grabbing;}
  #logo-spin canvas{width:100%;display:block;pointer-events:none;}
  .hint{
    font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--chrome);opacity:.55;text-align:center;
  }
  @media (prefers-reduced-motion: reduce){
    #ingresso{transition:none}
  }

  /* ---- HEADER COL LOGO CHE GIRA ---- */
  .testata{
    padding:22px 20px 10px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    perspective:900px;
  }
  .logo-sito{
    width:min(64vw,340px);
  }
  .logo-sito canvas{width:100%;display:block;}
  @keyframes giraY{
    from{transform:rotateY(0deg)}
    to{transform:rotateY(360deg)}
  }
  .lampo{
    width:100%;height:40px;
    background:var(--viola);
    position:relative;overflow:hidden;
  }
  .lampo span{
    position:absolute;left:50%;top:50%;
    font-family:'Anton',sans-serif;
    color:var(--nero);white-space:nowrap;
    font-size:52px;line-height:1;
    transform-origin:center;
  }

  /* ---- CATALOGO PEZZI UNICI ---- */
  .catalogo{
    max-width:520px;margin:0 auto;
    padding:26px 18px 60px;
    display:flex;flex-direction:column;gap:30px;
  }
  .capo{
    display:flex;flex-direction:column;
  }

  /* Slideshow: 3 immagini che si alternano con dissolvenza */
  .slideshow{
    position:relative;
    aspect-ratio:4/5;
    overflow:hidden;
    background:var(--nero);
    perspective:900px;
  }
  .slide{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transition:opacity 1s ease;
  }
  .slide.attiva{opacity:1;}

  /* Slide 1: grafica 3D che gira (segnaposto = logo) */
  .grafica3d{
    width:39%;
    animation:giraY 5s linear infinite;
    transform-style:preserve-3d;
  }
  .grafica3d img{width:100%;display:block;}
  .grafica3d.larga{width:72%;}

  /* Slide 2 e 3: segnaposto foto (da sostituire con <img>) */
  .anteprima{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    color:var(--chrome);
    font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;
    text-align:center;padding:0 14px;
  }
  .anteprima svg{width:46%;height:auto;}
  .anteprima span{opacity:.45;}

  /* Se la slide contiene una foto vera, riempie tutto il riquadro */
  .slide img.foto{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .slide img.foto.contenuta{
    object-fit:contain;padding:6%;box-sizing:border-box;
  }

  .capo-info{
    position:absolute;left:14px;bottom:12px;z-index:5;
    display:flex;flex-direction:column;gap:2px;
    pointer-events:none;
    text-shadow:0 2px 8px rgba(13,10,18,.9);
  }
  .capo-nome{
    font-family:'Anton',sans-serif;
    font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase;
    color:var(--chrome);
  }
  .capo-prezzo{
    font-size:.9rem;font-weight:700;color:var(--viola-chiaro);
  }

  .divisore{
    position:relative;height:96px;
    overflow:hidden;
  }
  .divisore img{
    position:absolute;bottom:2px;height:88px;width:auto;
    animation:corsa 7.5s linear infinite;
  }
  .divisore:nth-of-type(2) img{animation-delay:-2.6s;}
  .divisore:nth-of-type(3) img{animation-delay:-5.1s;}
  /* corre verso sinistra; uscita di scena -> rientra da destra (loop continuo) */
  @keyframes corsa{
    from{left:100%;}
    to{left:-125px;}
  }

  /* ---- SCHEDA PRODOTTO ---- */
  #scheda{
    position:fixed;inset:0;z-index:600;
    background:var(--nero);
    display:none;flex-direction:column;
    overflow-y:auto;
  }
  #scheda.aperta{display:flex;}
  .scheda-chiudi{
    position:sticky;top:0;align-self:flex-end;z-index:5;
    background:none;border:none;color:var(--chrome);
    font-size:1.9rem;line-height:1;padding:14px 18px;cursor:pointer;
    font-family:'Space Mono',monospace;
  }
  .galleria{
    display:flex;overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .galleria::-webkit-scrollbar{display:none;}
  .galleria img{
    flex:none;width:100%;
    aspect-ratio:4/5;object-fit:contain;
    scroll-snap-align:center;
  }
  .pallini{
    display:flex;gap:8px;justify-content:center;padding:12px 0 4px;
  }
  .pallini i{
    width:7px;height:7px;border-radius:50%;
    background:var(--chrome);opacity:.3;transition:opacity .2s;
  }
  .pallini i.on{opacity:1;background:var(--viola-chiaro);}
  .scheda-corpo{
    padding:10px 22px 46px;max-width:520px;margin:0 auto;width:100%;
    display:flex;flex-direction:column;gap:16px;
  }
  .scheda-riga1{display:flex;justify-content:space-between;align-items:baseline;}
  .scheda-nome{
    font-family:'Anton',sans-serif;font-size:1.9rem;
    letter-spacing:.04em;text-transform:uppercase;color:var(--chrome);
  }
  .scheda-prezzo{font-size:1.25rem;font-weight:700;color:var(--viola-chiaro);}
  .scheda-etichette{display:flex;flex-wrap:wrap;gap:8px;}
  .scheda-etichette span{
    font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;
    border:1px solid rgba(139,95,199,.5);color:var(--bianco);
    padding:6px 10px;
  }
  .scheda-desc{
    font-size:.8rem;line-height:1.75;color:var(--bianco);opacity:.85;
  }
  .compra{
    display:block;text-align:center;text-decoration:none;
    font-family:'Anton',sans-serif;font-size:1.05rem;
    letter-spacing:.14em;text-transform:uppercase;
    background:var(--viola);color:var(--nero);
    padding:16px 10px;margin-top:6px;
  }
  .compra:active{transform:scale(.985);}
  .scheda-note{
    font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--chrome);opacity:.55;text-align:center;
  }

  footer{
    text-align:center;
    padding:26px 18px 42px;
    font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--chrome);opacity:.5;
  }
  footer a{color:var(--viola-chiaro);text-decoration:none;}
  a:focus-visible,button:focus-visible,#logo-spin:focus-visible{outline:3px solid var(--viola);outline-offset:3px;}
</style>
</head>
<body class="bloccato">

<!-- INGRESSO -->
<div id="ingresso">
  <div id="logo-spin" tabindex="0" role="button" aria-label="Spinna il logo per entrare">
    <canvas id="spin-canvas" width="640" height="360" aria-hidden="true"></canvas>
  </div>
  <p class="hint">Spin the logo to enter</p>
</div>

<!-- SITO -->
<div class="lampo" aria-label="Fatto in casa, marchio italiano, indipendente, piccola produzione, fatto per durare, fatto con cura, tradizione italiana, pensato in provincia, pezzi unici">
  <span id="lampo-testo" aria-hidden="true"></span>
</div>
<div class="testata">
  <div class="logo-sito" aria-hidden="true">
    <canvas id="logo-canvas" width="640" height="360"></canvas>
  </div>
</div>

<main class="catalogo">

  <!-- ============================================================
       ARTICOLO = slideshow di 3 immagini (cambio ogni 3 secondi):
       1. grafica 3D che gira (per ora segnaposto col logo)
       2. foto del capo integro   → sostituisci il segnaposto con:
          <img class="foto" src="NOMEFILE.jpg" alt="...">
       3. foto indossata          → idem
       ============================================================ -->

  <article class="capo" style="cursor:pointer">
    <div class="slideshow">
      <div class="slide attiva">
        <div class="grafica3d"><img loading="lazy" decoding="async" src="pezzo1-grafica.webp" alt="Grafica del pezzo 1"></div>
      </div>
      <div class="slide">
        <img class="foto contenuta" loading="lazy" decoding="async" src="pezzo1-capo.webp" alt="Il capo steso">
      </div>
      <div class="capo-info">
        <h2 class="capo-nome">Pezzo 1</h2>
        <span class="capo-prezzo">€ 29,90</span>
      </div>
    </div>
  </article>

  <div class="divisore" aria-hidden="true"><img loading="lazy" decoding="async" src="skater.png" alt=""></div>

  <article class="capo" style="cursor:pointer">
    <div class="slideshow">
      <div class="slide attiva">
        <div class="grafica3d larga"><img loading="lazy" decoding="async" src="jeans-grafica.webp" alt="Grafica del pezzo 2"></div>
      </div>
      <div class="slide">
        <img class="foto contenuta" loading="lazy" decoding="async" src="jeans-capo.webp" alt="Il capo steso">
      </div>
      <div class="capo-info">
        <h2 class="capo-nome">Pezzo 2</h2>
        <span class="capo-prezzo">€ 29,90</span>
      </div>
    </div>
  </article>

  <div class="divisore skate" aria-hidden="true"><img loading="lazy" decoding="async" src="skater.png" alt=""></div>

  <article class="capo" style="cursor:pointer">
    <div class="slideshow">
      <div class="slide attiva">
        <div class="grafica3d"><img loading="lazy" decoding="async" src="pezzo2-grafica.webp" alt="Grafica del pezzo 2"></div>
      </div>
      <div class="slide">
        <img class="foto contenuta" loading="lazy" decoding="async" src="pezzo2-capo.webp" alt="Il capo steso">
      </div>
      <div class="capo-info">
        <h2 class="capo-nome">Pezzo 3</h2>
        <span class="capo-prezzo">€ 29,90</span>
      </div>
    </div>
  </article>

  <div class="divisore skate" aria-hidden="true"><img loading="lazy" decoding="async" src="skater.png" alt=""></div>

</main>

<div id="scheda" role="dialog" aria-modal="true">
  <button class="scheda-chiudi" aria-label="Chiudi">✕</button>
  <div class="galleria" id="scheda-galleria"></div>
  <div class="pallini" id="scheda-pallini"></div>
  <div class="scheda-corpo">
    <div class="scheda-riga1">
      <h2 class="scheda-nome" id="scheda-nome"></h2>
      <span class="scheda-prezzo" id="scheda-prezzo"></span>
    </div>
    <div class="scheda-etichette" id="scheda-etichette"></div>
    <p class="scheda-desc" id="scheda-desc"></p>
    <a class="compra" id="scheda-compra" href="#">Ordina via email</a>
    <p class="scheda-note">Pagamento online in arrivo · Spedizione tracciata in tutta Italia</p>
  </div>
</div>

<footer>
  © 2026 Weinervillestore · <a href="mailto:ordini@weinervillestar.com">ordini@weinervillestar.com</a>
</footer>

<script>
/* ---- INGRESSO: SPIN ORIZZONTALE CON FISICA ---- */
const ingresso = document.getElementById('ingresso');
const logoSpin = document.getElementById('logo-spin');
const SOGLIA = 1440;         // gradi totali per entrare (~4 giri)
const ATTRITO = 0.965;       // quanto rallenta a ogni frame
let rotY = 0;
let vel = 0;
let accumulo = 0;
let trascinando = false;
let ultimaX = 0;
let entrato = false;

function entraNelSito(){
  if (entrato) return;
  entrato = true;
  ingresso.classList.add('chiuso');
  document.body.classList.remove('bloccato');
}

/* render 3D a fotogrammi trasparenti in alta definizione:
   144 frame da 640px (2.5 gradi l'uno), divisi su due fogli
   per stare nei limiti di memoria degli iPhone.
   Ogni frame viene pre-ritagliato in una bitmap: disegno istantaneo. */
const ctxSpin = document.getElementById('spin-canvas').getContext('2d');
const ctxLogo = document.getElementById('logo-canvas').getContext('2d');
const NFR = 144, COLS = 12, PERFOGLIO = 72, FW = 640, FH = 360;
const FOGLI = ['logo-spin-a.webp', 'logo-spin-b.webp'].map(src => {
  const im = new Image(); im.src = src; return im;
});
let BITMAP = null;

function frameSu(ctx, idx){
  ctx.clearRect(0, 0, FW, FH);
  if (BITMAP){ ctx.drawImage(BITMAP[idx], 0, 0); return; }
  const foglio = FOGLI[Math.floor(idx / PERFOGLIO)];
  const loc = idx % PERFOGLIO;
  if (foglio.complete && foglio.naturalWidth)
    ctx.drawImage(foglio, (loc % COLS) * FW, Math.floor(loc / COLS) * FH, FW, FH, 0, 0, FW, FH);
}
function disegna(){
  frameSu(ctxSpin, ((Math.round(rotY / 2.5) % NFR) + NFR) % NFR);
}
let fogliPronti = 0;
FOGLI.forEach(im => im.onload = async () => {
  disegna();
  if (++fogliPronti < FOGLI.length) return;
  try {
    BITMAP = await Promise.all(Array.from({length: NFR}, (_, i) =>
      createImageBitmap(FOGLI[Math.floor(i / PERFOGLIO)],
        ((i % PERFOGLIO) % COLS) * FW, Math.floor((i % PERFOGLIO) / COLS) * FH, FW, FH)));
  } catch(e) {}
  disegna();
});

/* testata: il logo ruota da solo, un giro ogni 6 secondi, 30 fps */
let ultimoIdxLogo = -1;
function giraLogo(t){
  const idx = Math.floor((t % 6000) / 6000 * NFR);
  if (idx !== ultimoIdxLogo){ frameSu(ctxLogo, idx); ultimoIdxLogo = idx; }
  requestAnimationFrame(giraLogo);
}
requestAnimationFrame(giraLogo);
let riallineo = false, target = 0;

function frame(){
  if (!entrato){
    if (!trascinando && Math.abs(vel) > 0.05){
      rotY += vel;
      accumulo += Math.abs(vel);
      vel *= ATTRITO;
      if (accumulo >= SOGLIA) entraNelSito();
    } else if (!trascinando && Math.abs(vel) <= 0.05 && vel !== 0){
      vel = 0;
      target = Math.round(rotY / 360) * 360;
      riallineo = true;
      accumulo = 0;
    }
    if (riallineo){
      rotY += (target - rotY) * 0.12;
      if (Math.abs(target - rotY) < 0.4){ rotY = target; riallineo = false; }
    }
    disegna();
    requestAnimationFrame(frame);
  }
}
requestAnimationFrame(frame);

function inizio(x){
  trascinando = true;
  ultimaX = x;
  vel = 0;
  riallineo = false;
}
function muovi(x){
  if (!trascinando) return;
  const delta = (x - ultimaX) * 0.55;
  ultimaX = x;
  rotY += delta;
  accumulo += Math.abs(delta);
  vel = delta;
  if (accumulo >= SOGLIA) entraNelSito();
}
function fine(){
  trascinando = false;
}

logoSpin.addEventListener('touchstart', e => { e.preventDefault(); inizio(e.touches[0].clientX); }, {passive:false});
logoSpin.addEventListener('touchmove',  e => { e.preventDefault(); muovi(e.touches[0].clientX); }, {passive:false});
logoSpin.addEventListener('touchend', fine);
logoSpin.addEventListener('touchcancel', fine);
logoSpin.addEventListener('mousedown', e => { e.preventDefault(); inizio(e.clientX); });
window.addEventListener('mousemove', e => muovi(e.clientX));
window.addEventListener('mouseup', fine);

logoSpin.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); entraNelSito(); }
});

/* ---- BLOCCO LAMPO: frasi scritte a raffica, sempre a tutto riquadro ---- */
const FRASI = ["Fatto in casa","Marchio italiano","Indipendente","Piccola produzione",
               "Fatto per durare","Fatto con cura","Tradizione italiana",
               "Pensato in provincia","Pezzi unici"];
const lampoBox = document.querySelector('.lampo');
const lampoTxt = document.getElementById('lampo-testo');
let fIdx = 0, lIdx = 0;

function lampoFit(){
  const bw = lampoBox.clientWidth - 14;
  const bh = lampoBox.clientHeight - 10;
  const tw = lampoTxt.offsetWidth || 1;
  const th = lampoTxt.offsetHeight || 1;
  lampoTxt.style.transform =
    'translate(-50%,-50%) scale(' + (bw/tw) + ',' + (bh/th) + ')';
}
function lampoStep(){
  const frase = FRASI[fIdx].toUpperCase();
  lIdx++;
  if (lIdx > frase.length){
    setTimeout(() => { fIdx = (fIdx+1) % FRASI.length; lIdx = 0; lampoStep(); }, 200);
    return;
  }
  lampoTxt.textContent = frase.slice(0, lIdx);
  lampoFit();
  setTimeout(lampoStep, 50);
}
lampoStep();
window.addEventListener('resize', lampoFit);

/* ---- SCHEDA PRODOTTO ---- */
const PEZZI = [
  {
    nome:'Pezzo 1', prezzo:'\u20ac 29,90',
    etichette:['Taglia M','Vintage \u00b7 ottime condizioni','Pezzo unico'],
    desc:'T-shirt Champion nera second-hand, rilavorata a mano da WEINERVILLE con grafica gotica. Un solo esemplare: quando \u00e8 venduto, \u00e8 venduto.',
    foto:['pezzo1-grafica.webp','pezzo1-capo.webp','pezzo1-indossata.webp']
  },
  {
    nome:'Pezzo 2', prezzo:'\u20ac 29,90',
    etichette:['Taglia W32','Vintage \u00b7 ottime condizioni','Pezzo unico'],
    desc:'Jeans grigi second-hand, rilavorati a mano da WEINERVILLE con grafica tribal sul retro. Un solo esemplare: quando \u00e8 venduto, \u00e8 venduto.',
    foto:['jeans-grafica.webp','jeans-capo.webp']
  },
  {
    nome:'Pezzo 3', prezzo:'\u20ac 29,90',
    etichette:['Taglia M','Vintage \u00b7 ottime condizioni','Pezzo unico'],
    desc:'Polo Levi\u2019s blu navy second-hand, rilavorata a mano da WEINERVILLE con grafica tribal ricamata. Un solo esemplare: quando \u00e8 venduto, \u00e8 venduto.',
    foto:['pezzo2-grafica.webp','pezzo2-capo.webp']
  }
];
const scheda = document.getElementById('scheda');
const galleria = document.getElementById('scheda-galleria');
const pallini = document.getElementById('scheda-pallini');

function apriScheda(i){
  const p = PEZZI[i];
  document.getElementById('scheda-nome').textContent = p.nome;
  document.getElementById('scheda-prezzo').textContent = p.prezzo;
  document.getElementById('scheda-etichette').innerHTML =
    p.etichette.map(e => '<span>' + e + '</span>').join('');
  document.getElementById('scheda-desc').textContent = p.desc;
  const oggetto = encodeURIComponent('Ordine ' + p.nome + ' - WEINERVILLE');
  const corpo = encodeURIComponent('Ciao! Vorrei ordinare il ' + p.nome + ' (' + p.prezzo.replace('\u20ac','EUR') + ').\n\nNome e cognome:\nIndirizzo di spedizione:\nTelefono:');
  document.getElementById('scheda-compra').href =
    'mailto:ordini@weinervillestar.com?subject=' + oggetto + '&body=' + corpo;
  galleria.innerHTML = p.foto.map(f => '<img src="' + f + '" alt="">').join('');
  pallini.innerHTML = p.foto.map((_, j) => '<i' + (j === 0 ? ' class="on"' : '') + '></i>').join('');
  galleria.scrollLeft = 0;
  scheda.classList.add('aperta');
  document.body.classList.add('bloccato');
}
function chiudiScheda(){
  scheda.classList.remove('aperta');
  document.body.classList.remove('bloccato');
}
document.querySelector('.scheda-chiudi').addEventListener('click', chiudiScheda);
window.addEventListener('keydown', e => { if (e.key === 'Escape') chiudiScheda(); });
document.querySelectorAll('article.capo').forEach((a, i) => {
  a.addEventListener('click', () => apriScheda(i));
});
galleria.addEventListener('scroll', () => {
  const idx = Math.round(galleria.scrollLeft / galleria.clientWidth);
  pallini.querySelectorAll('i').forEach((p, j) => p.classList.toggle('on', j === idx));
}, {passive:true});

/* ---- SLIDESHOW ARTICOLI: cambio ogni 3 secondi con dissolvenza ---- */
document.querySelectorAll('.slideshow').forEach(box => {
  const slides = box.querySelectorAll('.slide');
  let i = 0;
  setInterval(() => {
    slides[i].classList.remove('attiva');
    i = (i + 1) % slides.length;
    slides[i].classList.add('attiva');
  }, 3000);
});
</script>

</body>
</html>
