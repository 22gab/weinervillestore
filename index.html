<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>WEINERVILLESTORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nero:#0D0A12;        /* nero-viola di fondo */
    --card:#1A1226;        /* viola scurissimo delle card */
    --viola:#8B5FC7;       /* viola del logo */
    --viola-chiaro:#B98FE8;
    --chrome:#C9CCD6;      /* argento chrome */
    --bianco:#F2F0F7;
  }
  html{color-scheme:dark;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--nero);
    color:var(--bianco);
    font-family:'Space Mono',monospace;
    overflow-x:hidden;
  }
  body.bloccato{overflow:hidden;}

  /* ---- INGRESSO ---- */
  #ingresso{
    position:fixed;inset:0;z-index:500;
    background:var(--nero);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;
    transition:opacity .5s;
    perspective:900px;
    touch-action:none;
  }
  #ingresso.chiuso{opacity:0;pointer-events:none;}
  #logo-spin{
    width:min(82vw,540px);
    cursor:grab;
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
    will-change:transform;
    transform-style:preserve-3d;
  }
  #logo-spin:active{cursor:grabbing;}
  #logo-spin canvas{width:100%;display:block;pointer-events:none;}
  .hint{
    font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--chrome);opacity:.55;text-align:center;
  }
  @media (prefers-reduced-motion: reduce){
    #ingresso{transition:none}
  }

  /* ---- HEADER COL LOGO CHE GIRA ---- */
  .testata{
    padding:22px 20px 10px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    perspective:900px;
  }
  .logo-sito{
    width:min(64vw,340px);
  }
  .logo-sito canvas{width:100%;display:block;}
  @keyframes giraY{
    from{transform:rotateY(0deg)}
    to{transform:rotateY(360deg)}
  }
  .lampo{
    width:100%;height:40px;
    background:var(--viola);
    position:relative;overflow:hidden;
  }
  .lampo span{
    position:absolute;left:50%;top:50%;
    font-family:'Anton',sans-serif;
    color:var(--nero);white-space:nowrap;
    font-size:52px;line-height:1;
    transform-origin:center;
  }


  /* ---- MENU METALLICO IN ALTO A SINISTRA ---- */
  .menu-fisso{
    position:fixed;top:0;left:0;width:100%;height:0;z-index:620;pointer-events:none;
  }
  .menu-btn{
    position:absolute;top:52px;left:14px;
    width:34px;height:34px;border:none;cursor:pointer;border-radius:9px;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    pointer-events:auto;
    background:linear-gradient(145deg,#eef0f5 0%,#9297a6 30%,#f6f7fa 50%,#7c8190 70%,#c4c8d3 100%);
    background-size:200% 200%;
    box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.6);
    animation:brillaMenu 3.4s ease-in-out infinite;
    -webkit-tap-highlight-color:transparent;
  }
  body.entrato .menu-fisso .menu-btn{display:flex;}
  body.overlay-aperto .menu-btn{display:none !important;}
  @keyframes brillaMenu{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .menu-btn i{display:block;width:16px;height:2px;background:#1a1622;border-radius:2px;transition:.25s;}
  .menu-btn.aperto i:nth-child(1){transform:translateY(5px) rotate(45deg);}
  .menu-btn.aperto i:nth-child(2){opacity:0;}
  .menu-btn.aperto i:nth-child(3){transform:translateY(-5px) rotate(-45deg);}

  .tendina{
    position:fixed;top:0;left:0;z-index:615;
    width:min(78vw,290px);height:100%;
    background:rgba(13,10,18,.97);border-right:1px solid rgba(201,204,214,.28);
    transform:translateX(-105%);transition:transform .3s ease;
    padding:66px 0 24px;display:flex;flex-direction:column;
    overflow-y:auto;
  }
  .tendina.aperta{transform:translateX(0);}
  .tendina button{
    background:none;border:none;text-align:left;cursor:pointer;
    font-family:'Anton',sans-serif;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--chrome);padding:15px 22px;border-bottom:1px solid rgba(201,204,214,.12);
    -webkit-tap-highlight-color:transparent;transition:background .2s,color .2s;
  }
  .tendina button:hover,.tendina button:active{background:rgba(139,95,199,.16);color:var(--viola-chiaro);}
  .tendina .sub{font-size:.62rem;letter-spacing:.02em;text-transform:none;color:var(--viola-chiaro);opacity:.65;font-family:'Space Mono',monospace;margin-top:3px;display:block;}
  #tendina-scrim{position:fixed;inset:0;z-index:610;background:rgba(5,4,8,.6);opacity:0;visibility:hidden;transition:.3s;}
  #tendina-scrim.on{opacity:1;visibility:visible;}

  /* ---- PAGINE TESTO (contatti, sicurezza, legali) ---- */
  .pagina-corpo{max-width:520px;margin:0 auto;width:100%;padding:14px 24px 50px;}
  .pagina-corpo h1{font-family:'Anton',sans-serif;font-size:1.7rem;letter-spacing:.04em;text-transform:uppercase;color:var(--chrome);margin-bottom:16px;}
  .pagina-corpo h2{font-family:'Anton',sans-serif;font-size:.92rem;letter-spacing:.08em;text-transform:uppercase;color:var(--viola-chiaro);margin:20px 0 7px;}
  .pagina-corpo p{font-size:.78rem;line-height:1.75;color:var(--bianco);opacity:.86;margin-bottom:9px;}
  .pagina-corpo a{color:var(--viola-chiaro);text-decoration:underline;text-underline-offset:3px;word-break:break-word;}
  .pagina-corpo .grande{font-size:.9rem;font-weight:700;color:var(--bianco);opacity:1;}

  /* ---- HOME: due pezzi in vista ---- */
  .home{max-width:520px;margin:0 auto;padding:18px 16px 10px;}
  .griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .capo{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .slideshow{
    position:relative;aspect-ratio:4/5;overflow:hidden;
    background:transparent;perspective:900px;
  }
  .slide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity 1s ease;
  }
  .slide.attiva{opacity:1;}
  .grafica3d{width:44%;animation:giraY 5s linear infinite;transform-style:preserve-3d;}
  .grafica3d img{width:100%;display:block;}
  .grafica3d.larga{width:76%;}
  .grafica-canvas{display:block;}
  .slide img.foto{height:80%;width:auto;max-width:92%;object-fit:contain;display:block;}
  .capo{display:flex;flex-direction:column;}
  .capo-info{
    display:flex;flex-direction:column;gap:2px;
    padding:10px 4px 0;pointer-events:none;
  }
  .capo-nome{font-family:'Anton',sans-serif;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;color:var(--chrome);line-height:1.2;}
  .capo-prezzo{font-size:.66rem;font-weight:700;color:var(--viola-chiaro);}

  /* ---- TASTI CHROME ---- */
  .chrome{
    position:relative;display:block;width:100%;padding:2px;border:none;cursor:pointer;
    font:inherit;color:var(--chrome);text-decoration:none;overflow:hidden;
    background:linear-gradient(180deg,#eef0f5 0%,#7b8090 42%,#fafbfd 50%,#969baa 62%,#c4c8d3 100%);
    -webkit-tap-highlight-color:transparent;
  }
  /* riflesso di luce che scorre sul metallo (solo transform: leggero per il telefono) */
  .chrome::after{
    content:'';position:absolute;top:-60%;left:-40%;width:35%;height:220%;
    background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 100%);
    transform:translateX(-120%) rotate(12deg);
    animation:luccica 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  .chrome > span{
    display:block;background:#100C16;position:relative;
    padding:10px 4px;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;
    text-align:center;line-height:1.4;
  }
  .chrome.pieno > span{background:transparent;}
  .chrome.pieno::after{z-index:2;}
  .chrome:active{transform:scale(.985);}
  @keyframes luccica{0%{transform:translateX(-140%) rotate(12deg)} 60%{transform:translateX(520%) rotate(12deg)} 100%{transform:translateX(520%) rotate(12deg)}}
  .shopnow{margin:22px auto 6px;width:min(72%,300px);}
  .shopnow > span{font-family:'Anton',sans-serif;font-size:1.2rem;letter-spacing:.22em;padding:14px 8px;color:var(--nero);text-shadow:0 1px 0 rgba(255,255,255,.35);}

  .divisore{position:relative;height:96px;overflow:hidden;}
  .divisore img{position:absolute;bottom:2px;height:88px;width:auto;animation:corsa 7.5s linear infinite;}
  .divisore.sfasato img{animation-delay:-3.7s;}
  @keyframes corsa{from{left:100%;} to{left:-125px;}}

  /* ---- CATALOGO (tutti i pezzi) ---- */
  .schermata{
    position:fixed;inset:0;z-index:600;background:var(--nero);
    display:none;flex-direction:column;overflow-y:auto;
  }
  .schermata.aperta{display:flex;}
  .schermata > *{flex-shrink:0;}
  .schermata-testa{
    position:sticky;top:0;z-index:5;background:var(--nero);
    display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
  }
  .tasto-icona{
    background:none;border:none;color:var(--chrome);cursor:pointer;
    font-family:'Space Mono',monospace;font-size:1.7rem;line-height:1;padding:6px 10px;
  }
  .schermata-titolo{
    font-family:'Anton',sans-serif;font-size:1.35rem;letter-spacing:.08em;text-transform:uppercase;color:var(--chrome);
  }
  .catalogo-corpo{max-width:520px;margin:0 auto;width:100%;padding:6px 16px 40px;}
  .catalogo-conta{
    text-align:center;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--chrome);opacity:.5;margin-bottom:16px;
  }

  /* ---- SCHEDA PRODOTTO ---- */
  .galleria{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .galleria::-webkit-scrollbar{display:none;}
  .galleria img{flex:none;width:100%;height:min(40vh,360px);object-fit:contain;padding:2% 6%;scroll-snap-align:center;}
  .pallini{display:flex;gap:8px;justify-content:center;padding:10px 0 2px;}
  .pallini i{width:7px;height:7px;border-radius:50%;background:var(--chrome);opacity:.3;transition:opacity .2s;}
  .pallini i.on{opacity:1;background:var(--viola-chiaro);}
  .scheda-corpo{padding:8px 22px 40px;max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px;}
  .scheda-riga1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .scheda-nome{font-family:'Anton',sans-serif;font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase;color:var(--chrome);}
  .scheda-prezzo{font-size:1.2rem;font-weight:700;color:var(--viola-chiaro);white-space:nowrap;}
  .tasti3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .tasti3 .chrome > span{height:42px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-size:.56rem;}
  .compra{padding:3px;}
  .compra.venduto{pointer-events:none;opacity:.55;}
  .compra.venduto > span{background:#2a2236;color:var(--chrome);}
  .compra > span{background:var(--viola);color:var(--nero);font-family:'Anton',sans-serif;font-size:1.15rem;letter-spacing:.16em;padding:15px 8px;}
  .pagamenti{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    font-size:.68rem;color:var(--chrome);margin-top:-6px;
  }
  .pagamenti svg{width:22px;height:15px;}
  .pagamenti b{font-weight:700;letter-spacing:.02em;}
  .pagamenti .altri-metodi{color:var(--chrome);opacity:.7;font-size:.62rem;}
  .altri-titolo{
    text-align:center;font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;
    color:var(--chrome);opacity:.5;margin-top:10px;
  }
  .altri{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---- POPUP centrale ---- */
  #popup{position:fixed;inset:0;z-index:700;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(5,4,8,.8);}
  #popup.aperto{display:flex;}
  .popup-box{
    position:relative;
    width:min(96vw,430px);
    max-width:calc(94vh * 0.98);
    aspect-ratio:745/760;
  }
  .popup-cornice{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none;}
  /* la finestra interna della cornice */
  .popup-finestra{
    position:absolute;left:22.4%;right:21.2%;top:28.8%;bottom:30.8%;
    background:#0D0A12;border-radius:9px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:9px 11px 11px;
    scrollbar-width:none;
  }
  .popup-finestra::-webkit-scrollbar{display:none;}
  /* il tasto chiudi coincide con la "x" disegnata sulla cornice */
  .popup-chiudi{
    position:absolute;left:59%;right:23.5%;top:1.5%;height:13%;
    background:none;border:none;cursor:pointer;font-size:0;
  }
  .popup-titolo{
    font-family:'Anton',sans-serif;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--viola-chiaro);margin-bottom:7px;text-align:center;
  }
  .popup-righe div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(139,95,199,.28);font-size:.6rem;}
  .popup-righe div:last-child{border-bottom:none;}
  .popup-righe div span:first-child{color:var(--chrome);opacity:.75;text-transform:uppercase;letter-spacing:.06em;}
  .popup-righe div span:last-child{text-align:right;color:var(--bianco);font-weight:700;}
  .popup-righe div.testa{
    background:rgba(139,95,199,.22);border-bottom:1px solid rgba(139,95,199,.5);
    padding:5px 7px;margin-bottom:2px;
  }
  .popup-righe div.testa span{font-family:'Anton',sans-serif;letter-spacing:.12em;font-size:.66rem;opacity:1;color:var(--chrome);}
  .popup-righe div.testa span:last-child{color:var(--viola-chiaro);}
  .popup-testo{font-size:.62rem;line-height:1.65;color:var(--bianco);opacity:.9;}
  .popup-testo p + p{margin-top:6px;}
  .popup-nota{display:block;text-align:center;margin-top:9px;font-size:.55rem;line-height:1.5;color:var(--viola-chiaro);text-decoration:none;}

  footer{
    text-align:center;
    padding:26px 18px 42px;
    font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--chrome);opacity:.5;
  }
  footer a{color:var(--viola-chiaro);text-decoration:none;}
  a:focus-visible,button:focus-visible,#logo-spin:focus-visible{outline:3px solid var(--viola);outline-offset:3px;}
</style>
</head>
<body class="bloccato">

<!-- INGRESSO -->
<div id="ingresso">
  <div id="logo-spin" tabindex="0" role="button" aria-label="Spinna il logo per entrare">
    <canvas id="spin-canvas" width="640" height="360" aria-hidden="true"></canvas>
  </div>

<!-- MENU -->
<div class="menu-fisso" aria-hidden="false"><button class="menu-btn" id="menu-btn" aria-label="Menu"><i></i><i></i><i></i></button></div>
<div id="tendina-scrim"></div>
<nav class="tendina" id="tendina">
  <button data-vai="catalogo">Tutti gli articoli</button>
  <button data-pagina="contatti">Contatti</button>
  <button data-link="https://www.instagram.com/weinervillestore/">Instagram<span class="sub">@weinervillestore</span></button>
  <button data-link="https://www.vinted.it/member/98251816-weinervillestore">Vinted<span class="sub">weinervillestore</span></button>

  <button data-pagina="legali">Privacy, Cookie e Termini</button>
</nav>

<!-- SITO -->
<div class="lampo" aria-label="Marchio indipendente, pezzi unici">
  <span id="lampo-testo" aria-hidden="true"></span>
</div>
<div class="testata">
  <div class="logo-sito" aria-hidden="true">
    <canvas id="logo-canvas" width="640" height="360"></canvas>

</div>

<main class="home">
  <div class="griglia" id="home-griglia"></div>

<!-- PAGINA TESTO -->

<!-- SCHEDA PRODOTTO -->
<div class="schermata" id="scheda" role="dialog" aria-modal="true">
  <div class="schermata-testa">
    <button class="tasto-icona" data-chiudi="scheda" aria-label="Chiudi">&larr;</button>
    <span></span>
    <button class="tasto-icona" data-chiudi="scheda" aria-label="Chiudi">&#10005;</button>
  </div>
  <div class="galleria" id="scheda-galleria"></div>
  <div class="pallini" id="scheda-pallini"></div>

    <div class="tasti3">
      <button class="chrome" data-popup="descrizione"><span>Descrizione</span></button>
      <button class="chrome" data-popup="misure"><span>Misure</span></button>

<!-- POPUP -->

  <div class="popup-box" role="dialog" aria-modal="true">

    </div>
  </div>
</div>

  © 2026 Weinervillestore · <a href="mailto:ordini@weinervillestar.com">ordini@weinervillestar.com</a>
</footer>

<script>
/* ---- INGRESSO: SPIN ORIZZONTALE CON FISICA ---- */
const ingresso = document.getElementById('ingresso');
const logoSpin = document.getElementById('logo-spin');
const SOGLIA = 1440;         // gradi totali per entrare (~4 giri)
const ATTRITO = 0.965;       // quanto rallenta a ogni frame
let rotY = 0;
let vel = 0;
let accumulo = 0;
let trascinando = false;
let ultimaX = 0;
let entrato = false;

function entraNelSito(){
  if (entrato) return;
  entrato = true;
  ingresso.classList.add('chiuso');
  document.body.classList.remove('bloccato');
  document.body.classList.add('entrato');
  setTimeout(avanzaCoda, 600);   // le grafiche dei pezzi partono dopo l'ingresso
}
const CODA_SPRITE = [];
let codaAttiva = false;
function avanzaCoda(){
  if (!entrato || codaAttiva || !CODA_SPRITE.length) return;
  const sp = CODA_SPRITE.shift(); codaAttiva = true;
  sp.carica(() => { if (sp.completo){ codaAttiva = false; setTimeout(avanzaCoda, 300); } });
}

/* ---- MOTORE SPRITE 3D (usato dal logo e dalle grafiche dei pezzi) ---- */
/* MODALITA' LEGGERA: telefoni con poca memoria / CPU (molti Android) usano sprite a meta' risoluzione */
const TOUCH = matchMedia('(pointer:coarse)').matches;
const LEGGERO = TOUCH && ((navigator.deviceMemory && navigator.deviceMemory <= 4) ||
                          (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4));
const pausa = ms => new Promise(r => setTimeout(r, ms));
class Sprite3D {
  constructor(o){
    Object.assign(this, o);
    if (LEGGERO){ this.fogli = this.fogli.map(f => f.replace('.webp', '-lo.webp')); this.fw = this.fw >> 1; this.fh = this.fh >> 1; }
    this.img = []; this.bitmap = null; this.caricato = false; this.pronti = 0;
  }
  carica(cb){
    if (this.caricato) return; this.caricato = true;
    this.img = this.fogli.map(src => { const im = new Image(); im.decoding = 'async'; im.src = src; return im; });
    this.img.forEach(im => im.onload = async () => {
      if (cb) cb();
      if (++this.pronti < this.img.length) return;
      try {
        // taglio i fotogrammi a piccoli blocchi, lasciando respirare la pagina tra un blocco e l'altro
        const bm = [];
        for (let i = 0; i < this.nfr; i += 8){
          const blocco = [];
          for (let k = i; k < Math.min(i + 8, this.nfr); k++)
            blocco.push(createImageBitmap(this.img[Math.floor(k / this.perfoglio)],
              ((k % this.perfoglio) % this.cols) * this.fw, Math.floor((k % this.perfoglio) / this.cols) * this.fh, this.fw, this.fh));
          bm.push(...await Promise.all(blocco));
          await pausa(0);
        }
        this.bitmap = bm;
        this.img.forEach(im => { im.src = ''; });   // libero la memoria dei fogli interi
        this.img = [];
      } catch(e) {}
      this.completo = true;
      if (cb) cb();
    });
  }
  disegna(ctx, idx){
    ctx.clearRect(0, 0, this.fw, this.fh);
    if (this.bitmap){ ctx.drawImage(this.bitmap[idx], 0, 0); return; }
    if (!this.img.length) return;
    const foglio = this.img[Math.floor(idx / this.perfoglio)];
    const loc = idx % this.perfoglio;
    if (foglio && foglio.complete && foglio.naturalWidth)
      ctx.drawImage(foglio, (loc % this.cols) * this.fw, Math.floor(loc / this.cols) * this.fh, this.fw, this.fh, 0, 0, this.fw, this.fh);
  }
}
const LOGO = new Sprite3D({fogli:['logo-spin-a.webp','logo-spin-b.webp'], nfr:120, cols:10, perfoglio:60, fw:640, fh:360, giro:6000});

const inVista = new IntersectionObserver(e => e.forEach(x => {
  const r = ROTANTI.find(r => r.ctx.canvas === x.target); if (r) r.visibile = x.isIntersecting;
}), {threshold: 0});

let ultimoGiro = 0;
function giraTutti(t){
  requestAnimationFrame(giraTutti);
  if (t - ultimoGiro < 33) return;      // ~30fps: fluido ma meta' del carico
  ultimoGiro = t;
  const coperto = document.body.classList.contains('overlay-aperto');
  for (const r of ROTANTI){
    if (!r.sprite.caricato || !r.visibile) continue;
    if (entrato === false && r.sprite !== LOGO) continue;
    if (coperto && r.sprite !== LOGO && !r.inSchermata) continue;
    const idx = Math.floor((t % r.sprite.giro) / r.sprite.giro * r.sprite.nfr);
    if (idx !== r.ultimo){ r.sprite.disegna(r.ctx, idx); r.ultimo = idx; }
  }
}
requestAnimationFrame(giraTutti);
let riallineo = false, target = 0;

function frame(){
  if (!entrato){
    if (!trascinando && Math.abs(vel) > 0.05){
      rotY += vel;
      accumulo += Math.abs(vel);
      vel *= ATTRITO;
      if (accumulo >= SOGLIA) entraNelSito();
    } else if (!trascinando && Math.abs(vel) <= 0.05 && vel !== 0){
      vel = 0;
      target = Math.round(rotY / 360) * 360;
      riallineo = true;
      accumulo = 0;
    }
    if (riallineo){
      rotY += (target - rotY) * 0.12;
      if (Math.abs(target - rotY) < 0.4){ rotY = target; riallineo = false; }
    }
    disegna();
    requestAnimationFrame(frame);
  }
}
requestAnimationFrame(frame);

function inizio(x){
  trascinando = true;
  ultimaX = x;
  vel = 0;
  riallineo = false;
}
function muovi(x){
  if (!trascinando) return;
  const delta = (x - ultimaX) * 0.55;
  ultimaX = x;
  rotY += delta;
  accumulo += Math.abs(delta);
  vel = delta;
  if (accumulo >= SOGLIA) entraNelSito();
}
function fine(){
  trascinando = false;
}

logoSpin.addEventListener('touchstart', e => { e.preventDefault(); inizio(e.touches[0].clientX); }, {passive:false});
logoSpin.addEventListener('touchmove',  e => { e.preventDefault(); muovi(e.touches[0].clientX); }, {passive:false});
logoSpin.addEventListener('touchend', fine);
logoSpin.addEventListener('touchcancel', fine);
logoSpin.addEventListener('mousedown', e => { e.preventDefault(); inizio(e.clientX); });
window.addEventListener('mousemove', e => muovi(e.clientX));
window.addEventListener('mouseup', fine);

logoSpin.addEventListener('keydown', e => {
