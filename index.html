<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>WEINERVILLESTORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nero:#0D0A12;        /* nero-viola di fondo */
    --card:#1A1226;        /* viola scurissimo delle card */
    --viola:#8B5FC7;       /* viola del logo */
    --viola-chiaro:#B98FE8;
    --chrome:#C9CCD6;      /* argento chrome */
    --bianco:#F2F0F7;
  }
  html{color-scheme:dark;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--nero);
    color:var(--bianco);
    font-family:'Space Mono',monospace;
    overflow-x:hidden;
  }
  body.bloccato{overflow:hidden;}

  /* ---- INGRESSO ---- */
  #ingresso{
    position:fixed;inset:0;z-index:500;
    background:var(--nero);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:34px;
    transition:opacity .5s;
    perspective:900px;
    touch-action:none;
  }
  #ingresso.chiuso{opacity:0;pointer-events:none;}
  #logo-spin{
    width:min(82vw,540px);
    cursor:grab;
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
    will-change:transform;
    transform-style:preserve-3d;
  }
  #logo-spin:active{cursor:grabbing;}
  #logo-spin canvas{width:100%;display:block;pointer-events:none;}
  .hint{
    font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--chrome);opacity:.55;text-align:center;
  }
  @media (prefers-reduced-motion: reduce){
    #ingresso{transition:none}
  }

  /* ---- HEADER COL LOGO CHE GIRA ---- */
  .testata{
    padding:22px 20px 10px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    perspective:900px;
  }
  .logo-sito{
    width:min(64vw,340px);
  }
  .logo-sito canvas{width:100%;display:block;}
  @keyframes giraY{
    from{transform:rotateY(0deg)}
    to{transform:rotateY(360deg)}
  }
  .lampo{
    width:100%;height:40px;
    background:var(--viola);
    position:relative;overflow:hidden;
  }
  .lampo span{
    position:absolute;left:50%;top:50%;
    font-family:'Anton',sans-serif;
    color:var(--nero);white-space:nowrap;
    font-size:52px;line-height:1;
    transform-origin:center;
  }

  /* ---- HOME: due pezzi in vista ---- */
  .home{max-width:520px;margin:0 auto;padding:18px 16px 10px;}
  .griglia{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .capo{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .slideshow{
    position:relative;aspect-ratio:4/5;overflow:hidden;
    background:transparent;perspective:900px;
  }
  .slide{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity 1s ease;
  }
  .slide.attiva{opacity:1;}
  .grafica3d{width:44%;animation:giraY 5s linear infinite;transform-style:preserve-3d;}
  .grafica3d img{width:100%;display:block;}
  .grafica3d.larga{width:76%;}
  .grafica-canvas{display:block;}
  .slide img.foto{width:100%;height:100%;object-fit:contain;padding:7%;display:block;}
  .capo-info{
    position:absolute;left:10px;bottom:9px;z-index:5;
    display:flex;flex-direction:column;gap:1px;pointer-events:none;
    text-shadow:0 2px 8px rgba(13,10,18,.9);
  }
  .capo-nome{font-family:'Anton',sans-serif;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase;color:var(--chrome);}
  .capo-prezzo{font-size:.72rem;font-weight:700;color:var(--viola-chiaro);}

  /* ---- TASTI CHROME ---- */
  .chrome{
    position:relative;display:block;width:100%;padding:2px;border:none;cursor:pointer;
    font:inherit;color:var(--chrome);text-decoration:none;overflow:hidden;
    background:linear-gradient(180deg,#eef0f5 0%,#7b8090 42%,#fafbfd 50%,#969baa 62%,#c4c8d3 100%);
    -webkit-tap-highlight-color:transparent;
  }
  /* riflesso di luce che scorre sul metallo (solo transform: leggero per il telefono) */
  .chrome::after{
    content:'';position:absolute;top:-60%;left:-40%;width:35%;height:220%;
    background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 100%);
    transform:translateX(-120%) rotate(12deg);
    animation:luccica 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  .chrome > span{
    display:block;background:#100C16;position:relative;
    padding:10px 4px;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;
    text-align:center;line-height:1.4;
  }
  .chrome.pieno > span{background:transparent;}
  .chrome.pieno::after{z-index:2;}
  .chrome:active{transform:scale(.985);}
  @keyframes luccica{0%{transform:translateX(-140%) rotate(12deg)} 60%{transform:translateX(520%) rotate(12deg)} 100%{transform:translateX(520%) rotate(12deg)}}
  .shopnow{margin:22px auto 6px;width:min(72%,300px);}
  .shopnow > span{font-family:'Anton',sans-serif;font-size:1.2rem;letter-spacing:.22em;padding:14px 8px;color:var(--nero);text-shadow:0 1px 0 rgba(255,255,255,.35);}

  .divisore{position:relative;height:96px;overflow:hidden;}
  .divisore img{position:absolute;bottom:2px;height:88px;width:auto;animation:corsa 7.5s linear infinite;}
  .divisore.sfasato img{animation-delay:-3.7s;}
  @keyframes corsa{from{left:100%;} to{left:-125px;}}

  /* ---- CATALOGO (tutti i pezzi) ---- */
  .schermata{
    position:fixed;inset:0;z-index:600;background:var(--nero);
    display:none;flex-direction:column;overflow-y:auto;
  }
  .schermata.aperta{display:flex;}
  .schermata > *{flex-shrink:0;}
  .schermata-testa{
    position:sticky;top:0;z-index:5;background:var(--nero);
    display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
  }
  .tasto-icona{
    background:none;border:none;color:var(--chrome);cursor:pointer;
    font-family:'Space Mono',monospace;font-size:1.7rem;line-height:1;padding:6px 10px;
  }
  .schermata-titolo{
    font-family:'Anton',sans-serif;font-size:1.35rem;letter-spacing:.08em;text-transform:uppercase;color:var(--chrome);
  }
  .catalogo-corpo{max-width:520px;margin:0 auto;width:100%;padding:6px 16px 40px;}
  .catalogo-conta{
    text-align:center;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;
    color:var(--chrome);opacity:.5;margin-bottom:16px;
  }

  /* ---- SCHEDA PRODOTTO ---- */
  .galleria{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .galleria::-webkit-scrollbar{display:none;}
  .galleria img{flex:none;width:100%;aspect-ratio:4/5;object-fit:contain;padding:4%;scroll-snap-align:center;}
  .pallini{display:flex;gap:8px;justify-content:center;padding:10px 0 2px;}
  .pallini i{width:7px;height:7px;border-radius:50%;background:var(--chrome);opacity:.3;transition:opacity .2s;}
  .pallini i.on{opacity:1;background:var(--viola-chiaro);}
  .scheda-corpo{padding:14px 22px 46px;max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:18px;}
  .scheda-riga1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .scheda-nome{font-family:'Anton',sans-serif;font-size:1.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--chrome);}
  .scheda-prezzo{font-size:1.2rem;font-weight:700;color:var(--viola-chiaro);white-space:nowrap;}
  .tasti3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .compra{padding:3px;}
  .compra > span{background:var(--viola);color:var(--nero);font-family:'Anton',sans-serif;font-size:1.15rem;letter-spacing:.16em;padding:15px 8px;}
  .pagamenti{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    font-size:.68rem;color:var(--chrome);margin-top:-6px;
  }
  .pagamenti svg{width:22px;height:15px;}
  .pagamenti b{font-weight:700;letter-spacing:.02em;}
  .pagamenti a{color:var(--viola-chiaro);font-size:.62rem;text-decoration:underline;text-underline-offset:3px;}
  .altri-titolo{
    text-align:center;font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;
    color:var(--chrome);opacity:.5;margin-top:10px;
  }
  .altri{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* ---- POPUP centrale ---- */
  #popup{position:fixed;inset:0;z-index:700;display:none;align-items:center;justify-content:center;padding:26px;background:rgba(5,4,8,.72);}
  #popup.aperto{display:flex;}
  .popup-box{
    width:100%;max-width:400px;max-height:72vh;overflow-y:auto;
    background:var(--card);border:1px solid #a4a8b6;padding:20px 20px 22px;position:relative;
  }
  .popup-chiudi{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--chrome);font-size:1.25rem;cursor:pointer;font-family:'Space Mono',monospace;}
  .popup-titolo{font-family:'Anton',sans-serif;font-size:1.3rem;letter-spacing:.08em;text-transform:uppercase;color:var(--chrome);margin-bottom:12px;}
  .popup-righe div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid rgba(139,95,199,.22);font-size:.72rem;}
  .popup-righe div span:first-child{color:var(--chrome);opacity:.7;}
  .popup-righe div span:last-child{text-align:right;color:var(--bianco);font-weight:700;}
  .popup-testo{font-size:.76rem;line-height:1.75;color:var(--bianco);opacity:.88;}
  .popup-testo p + p{margin-top:9px;}
  .popup-nota{display:block;text-align:center;margin-top:16px;font-size:.7rem;color:var(--viola-chiaro);text-decoration:none;}

  footer{
    text-align:center;
    padding:26px 18px 42px;
    font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--chrome);opacity:.5;
  }
  footer a{color:var(--viola-chiaro);text-decoration:none;}
  a:focus-visible,button:focus-visible,#logo-spin:focus-visible{outline:3px solid var(--viola);outline-offset:3px;}
</style>
</head>
<body class="bloccato">

<!-- INGRESSO -->
<div id="ingresso">
  <div id="logo-spin" tabindex="0" role="button" aria-label="Spinna il logo per entrare">
    <canvas id="spin-canvas" width="640" height="360" aria-hidden="true"></canvas>
  </div>
  <p class="hint">Spin the logo to enter</p>
</div>

<!-- SITO -->
<div class="lampo" aria-label="Fatto in casa, marchio italiano, indipendente, piccola produzione, fatto per durare, fatto con cura, tradizione italiana, pensato in provincia, pezzi unici">

<main class="home">
  <div class="griglia" id="home-griglia"></div>

</main>

    <div class="schermata-titolo">Tutti i pezzi</div>

    <div class="catalogo-conta" id="catalogo-conta"></div>
    <div class="griglia" id="catalogo-griglia"></div>
  </div>
  <div class="divisore sfasato" aria-hidden="true"><img loading="lazy" decoding="async" src="skater.png" alt=""></div>
</div>

<!-- SCHEDA PRODOTTO -->
<div class="schermata" id="scheda" role="dialog" aria-modal="true">
  <div class="schermata-testa">
    <button class="tasto-icona" data-chiudi="scheda" aria-label="Chiudi">&larr;</button>
    <span></span>
    <button class="tasto-icona" data-chiudi="scheda" aria-label="Chiudi">&#10005;</button>
  </div>
  <div class="galleria" id="scheda-galleria"></div>
  <div class="pallini" id="scheda-pallini"></div>
  <div class="scheda-corpo">
    <div class="scheda-riga1">
      <h2 class="scheda-nome" id="scheda-nome"></h2>
      <span class="scheda-prezzo" id="scheda-prezzo"></span>
    </div>
    <div class="tasti3">
      <button class="chrome" data-popup="descrizione"><span>Descrizione</span></button>
      <button class="chrome" data-popup="misure"><span>Misure</span></button>
      <button class="chrome" data-popup="spedizione"><span>Spedizione<br>e resi</span></button>
    </div>
    <a class="chrome compra" id="scheda-compra" href="#"><span>Acquista</span></a>
    <div class="pagamenti">
      <svg viewBox="0 0 24 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1.5" width="22" height="13" rx="2"/><line x1="1" y1="5.5" x2="23" y2="5.5" stroke-width="2.5"/></svg>
      <b>PayPal</b><span style="opacity:.4">&middot;</span>
      <a href="#" data-popup="pagamenti">altri metodi di pagamento</a>
    </div>
    <div class="altri-titolo">&mdash; Altri pezzi &mdash;</div>
    <div class="altri" id="scheda-altri"></div>
  </div>
</div>

<!-- POPUP -->
<div id="popup">
  <div class="popup-box" role="dialog" aria-modal="true">
    <button class="popup-chiudi" aria-label="Chiudi">&#10005;</button>
    <div class="popup-titolo" id="popup-titolo"></div>
    <div id="popup-contenuto"></div>
  </div>
</div>

<footer>
  © 2026 Weinervillestore · <a href="mailto:ordini@weinervillestar.com">ordini@weinervillestar.com</a>
</footer>

<script>
/* ---- INGRESSO: SPIN ORIZZONTALE CON FISICA ---- */
const ingresso = document.getElementById('ingresso');
const logoSpin = document.getElementById('logo-spin');
const SOGLIA = 1440;         // gradi totali per entrare (~4 giri)
const ATTRITO = 0.965;       // quanto rallenta a ogni frame
let rotY = 0;
let vel = 0;
let accumulo = 0;
let trascinando = false;
let ultimaX = 0;
let entrato = false;

function entraNelSito(){
  if (entrato) return;
  entrato = true;
  ingresso.classList.add('chiuso');
  document.body.classList.remove('bloccato');
}

/* ---- MOTORE SPRITE 3D (usato dal logo e dalle grafiche dei pezzi) ---- */
class Sprite3D {
  constructor(o){ Object.assign(this, o); this.img = []; this.bitmap = null; this.caricato = false; this.pronti = 0; }
  carica(cb){
    if (this.caricato) return; this.caricato = true;
    this.img = this.fogli.map(src => { const im = new Image(); im.src = src; return im; });
    this.img.forEach(im => im.onload = async () => {
      if (cb) cb();
      if (++this.pronti < this.img.length) return;
      try {
        this.bitmap = await Promise.all(Array.from({length: this.nfr}, (_, i) =>
          createImageBitmap(this.img[Math.floor(i / this.perfoglio)],
            ((i % this.perfoglio) % this.cols) * this.fw, Math.floor((i % this.perfoglio) / this.cols) * this.fh, this.fw, this.fh)));
        this.img.forEach(im => { im.src = ''; });   // libero la memoria dei fogli interi
        this.img = [];
      } catch(e) {}
      if (cb) cb();
    });
  }
  disegna(ctx, idx){
    ctx.clearRect(0, 0, this.fw, this.fh);
    if (this.bitmap){ ctx.drawImage(this.bitmap[idx], 0, 0); return; }
    if (!this.img.length) return;
    const foglio = this.img[Math.floor(idx / this.perfoglio)];
    const loc = idx % this.perfoglio;
    if (foglio && foglio.complete && foglio.naturalWidth)
      ctx.drawImage(foglio, (loc % this.cols) * this.fw, Math.floor(loc / this.cols) * this.fh, this.fw, this.fh, 0, 0, this.fw, this.fh);
  }
}
const LOGO = new Sprite3D({fogli:['logo-spin-a.webp','logo-spin-b.webp'], nfr:120, cols:10, perfoglio:60, fw:640, fh:360, giro:6000});
const ctxSpin = document.getElementById('spin-canvas').getContext('2d');
const ctxLogo = document.getElementById('logo-canvas').getContext('2d');
const NFR = LOGO.nfr;
function disegna(){ LOGO.disegna(ctxSpin, ((Math.round(rotY / (360 / NFR)) % NFR) + NFR) % NFR); }
LOGO.carica(disegna);

/* canvas che ruotano da soli (logo in testata + grafiche dei pezzi) */
const ROTANTI = [{sprite: LOGO, ctx: ctxLogo, ultimo: -1, visibile: true}];
const inVista = new IntersectionObserver(e => e.forEach(x => {
  const r = ROTANTI.find(r => r.ctx.canvas === x.target); if (r) r.visibile = x.isIntersecting;
}), {threshold: 0});
inVista.observe(ctxLogo.canvas);
function giraTutti(t){
  for (const r of ROTANTI){
    if (!r.sprite.caricato || !r.visibile) continue;
    if (entrato === false && r.sprite !== LOGO) continue;
    const idx = Math.floor((t % r.sprite.giro) / r.sprite.giro * r.sprite.nfr);
    if (idx !== r.ultimo){ r.sprite.disegna(r.ctx, idx); r.ultimo = idx; }
  }
  requestAnimationFrame(giraTutti);
}
requestAnimationFrame(giraTutti);
let riallineo = false, target = 0;

function frame(){
  if (!entrato){
    if (!trascinando && Math.abs(vel) > 0.05){
      rotY += vel;
      accumulo += Math.abs(vel);
      vel *= ATTRITO;
      if (accumulo >= SOGLIA) entraNelSito();
    } else if (!trascinando && Math.abs(vel) <= 0.05 && vel !== 0){
      vel = 0;
      target = Math.round(rotY / 360) * 360;
      riallineo = true;
      accumulo = 0;
    }
    if (riallineo){
      rotY += (target - rotY) * 0.12;
      if (Math.abs(target - rotY) < 0.4){ rotY = target; riallineo = false; }
    }
    disegna();
    requestAnimationFrame(frame);
  }
}
requestAnimationFrame(frame);

function inizio(x){
  trascinando = true;
  ultimaX = x;
  vel = 0;
  riallineo = false;
}
function muovi(x){
  if (!trascinando) return;
  const delta = (x - ultimaX) * 0.55;
  ultimaX = x;
  rotY += delta;
  accumulo += Math.abs(delta);
  vel = delta;
  if (accumulo >= SOGLIA) entraNelSito();
}
function fine(){
  trascinando = false;
}

logoSpin.addEventListener('touchstart', e => { e.preventDefault(); inizio(e.touches[0].clientX); }, {passive:false});
logoSpin.addEventListener('touchmove',  e => { e.preventDefault(); muovi(e.touches[0].clientX); }, {passive:false});
logoSpin.addEventListener('touchend', fine);
logoSpin.addEventListener('touchcancel', fine);
logoSpin.addEventListener('mousedown', e => { e.preventDefault(); inizio(e.clientX); });
window.addEventListener('mousemove', e => muovi(e.clientX));
window.addEventListener('mouseup', fine);

logoSpin.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); entraNelSito(); }
});

/* ---- BLOCCO LAMPO: frasi scritte a raffica, sempre a tutto riquadro ---- */
const FRASI = ["Fatto in casa","Marchio italiano","Indipendente","Piccola produzione",
               "Fatto per durare","Fatto con cura","Tradizione italiana",
               "Pensato in provincia","Pezzi unici"];
const lampoBox = document.querySelector('.lampo');
const lampoTxt = document.getElementById('lampo-testo');
let fIdx = 0, lIdx = 0;

function lampoFit(){
  const bw = lampoBox.clientWidth - 14;
  const bh = lampoBox.clientHeight - 10;
  const tw = lampoTxt.offsetWidth || 1;
  const th = lampoTxt.offsetHeight || 1;
  lampoTxt.style.transform =
    'translate(-50%,-50%) scale(' + (bw/tw) + ',' + (bh/th) + ')';
}
function lampoStep(){
  const frase = FRASI[fIdx].toUpperCase();
  lIdx++;
  if (lIdx > frase.length){
    setTimeout(() => { fIdx = (fIdx+1) % FRASI.length; lIdx = 0; lampoStep(); }, 200);
    return;
  }
  lampoTxt.textContent = frase.slice(0, lIdx);
  lampoFit();
  setTimeout(lampoStep, 50);
}
lampoStep();
window.addEventListener('resize', lampoFit);

/* ---- DATI DEI PEZZI ---- */
const PEZZI = [
  {
    nome:'Pezzo 1', prezzo:'\u20ac 29,90',
    grafica:{tipo:'sprite', fogli:['pezzo1-spin-a.webp','pezzo1-spin-b.webp'], nfr:108, cols:9, perfoglio:54, fw:300, fh:617, giro:4200, larghezza:'46%'},
    foto:['pezzo1-capo.webp','pezzo1-indossata.webp'],
    misure:[['Taglia','M'],['Spalle','\u2014 cm'],['Petto','\u2014 cm'],['Lunghezza','\u2014 cm'],['Vestibilit\u00e0','Regular'],['Modello','\u2014 cm \u00b7 porta M']],
    descrizione:[
      'T-shirt Champion nera second-hand, rilavorata a mano da WEINERVILLE con grafica gotica. Un solo esemplare: quando \u00e8 venduto, \u00e8 venduto.',
      'Composizione: \u2014. Condizioni: vintage, ottime, senza difetti rilevanti.',
      'Lavaggio: a rovescio, 30\u00b0, niente asciugatrice.'
    ]
  },
  {
    nome:'Pezzo 2', prezzo:'\u20ac 29,90',
    grafica:{tipo:'sprite', fogli:['jeans-spin-a.webp','jeans-spin-b.webp'], nfr:108, cols:6, perfoglio:54, fw:480, fh:228, giro:4200, larghezza:'84%'},
    foto:['jeans-capo.webp'],
    misure:[['Taglia','W32'],['Vita','\u2014 cm'],['Cavallo','\u2014 cm'],['Gamba','\u2014 cm'],['Vestibilit\u00e0','Regular'],['Modello','\u2014 cm \u00b7 porta W32']],
    descrizione:[
      'Jeans grigi second-hand, rilavorati a mano da WEINERVILLE con grafica tribal sul retro. Un solo esemplare: quando \u00e8 venduto, \u00e8 venduto.',
      'Composizione: denim, \u2014. Condizioni: vintage, ottime, senza difetti rilevanti.',
      'Lavaggio: a rovescio, 30\u00b0, niente asciugatrice.'
    ]
  },
  {
    nome:'Pezzo 3', prezzo:'\u20ac 29,90',
    grafica:{tipo:'img', src:'pezzo2-grafica.webp', larga:false},
    foto:['pezzo2-capo.webp'],
    misure:[['Taglia','M'],['Spalle','\u2014 cm'],['Petto','\u2014 cm'],['Lunghezza','\u2014 cm'],['Vestibilit\u00e0','Regular'],['Modello','\u2014 cm \u00b7 porta M']],
    descrizione:[
      'Polo Levi\u2019s blu navy second-hand, rilavorata a mano da WEINERVILLE con grafica tribal. Un solo esemplare: quando \u00e8 venduto, \u00e8 venduto.',
      'Composizione: \u2014. Condizioni: vintage, ottime, senza difetti rilevanti.',
      'Lavaggio: a rovescio, 30\u00b0, niente asciugatrice.'
    ]
  }
];
const SPEDIZIONE = [['Spedizione Italia','\u20ac 6,00'],['Tempi','2-4 giorni lavorativi'],['Corriere','tracciato'],
                    ['Tracking','via email'],['Resi','entro 14 giorni'],['Rimborso','completo']];
const PAGAMENTI = [['PayPal','\u2713'],['Carte','Visa \u00b7 Mastercard \u00b7 Amex'],['Apple Pay','\u2713'],['Google Pay','\u2713']];
const EMAIL = 'ordini@weinervillestar.com';

/* ---- CARD ARTICOLO (usata in home e catalogo) ---- */
const SPRITES = new Map();
function spriteDi(p){
  if (!SPRITES.has(p)) SPRITES.set(p, new Sprite3D(p.grafica));
  return SPRITES.get(p);
}
function creaCard(i){
  const p = PEZZI[i];
  const art = document.createElement('article');
  art.className = 'capo';
  let slide1;
  if (p.grafica.tipo === 'sprite'){
    slide1 = '<canvas class="grafica-canvas" width="' + p.grafica.fw + '" height="' + p.grafica.fh + '" style="width:' + p.grafica.larghezza + '"></canvas>';
  } else {
    slide1 = '<div class="grafica3d' + (p.grafica.larga ? ' larga' : '') + '"><img src="' + p.grafica.src + '" alt=""></div>';
  }
  art.innerHTML =
    '<div class="slideshow">' +
      '<div class="slide attiva">' + slide1 + '</div>' +
      '<div class="slide"><img class="foto" loading="lazy" decoding="async" src="' + p.foto[0] + '" alt="' + p.nome + '"></div>' +
      '<div class="capo-info"><h2 class="capo-nome">' + p.nome + '</h2><span class="capo-prezzo">' + p.prezzo + '</span></div>' +
    '</div>';
  art.addEventListener('click', () => apriScheda(i));
  const cv = art.querySelector('canvas');
  if (cv){
    const sp = spriteDi(p);
    ROTANTI.push({sprite: sp, ctx: cv.getContext('2d'), ultimo: -1, visibile: false});
    inVista.observe(cv);
    // carico i fotogrammi solo quando la card e' in vista
    new IntersectionObserver((e, obs) => {
      if (e.some(x => x.isIntersecting)){ sp.carica(); obs.disconnect(); }
    }, {rootMargin:'200px'}).observe(art);
  }
  const slides = art.querySelectorAll('.slide');
  let k = 0;
  setInterval(() => { slides[k].classList.remove('attiva'); k = (k + 1) % slides.length; slides[k].classList.add('attiva'); }, 3000);
  return art;
}
const homeGriglia = document.getElementById('home-griglia');
PEZZI.slice(0, 2).forEach((_, i) => homeGriglia.appendChild(creaCard(i)));
const catGriglia = document.getElementById('catalogo-griglia');
PEZZI.forEach((_, i) => catGriglia.appendChild(creaCard(i)));
document.getElementById('catalogo-conta').textContent = PEZZI.length + ' pezzi unici disponibili';

/* ---- SCHERMATE (catalogo, scheda) ---- */
function apriSchermata(id){
  document.getElementById(id).classList.add('aperta');
  document.body.classList.add('bloccato');
}
function chiudiSchermata(id){
  document.getElementById(id).classList.remove('aperta');
  if (!document.querySelector('.schermata.aperta')) document.body.classList.remove('bloccato');
}
document.getElementById('shopnow').addEventListener('click', e => { e.preventDefault(); apriSchermata('catalogo'); });
document.querySelectorAll('[data-chiudi]').forEach(b => b.addEventListener('click', () => chiudiSchermata(b.dataset.chiudi)));

/* ---- SCHEDA PRODOTTO ---- */
let pezzoAperto = 0;
const scheda = document.getElementById('scheda');
const galleria = document.getElementById('scheda-galleria');
const pallini = document.getElementById('scheda-pallini');
function apriScheda(i){
  pezzoAperto = i;
  const p = PEZZI[i];
  document.getElementById('scheda-nome').textContent = p.nome;
  document.getElementById('scheda-prezzo').textContent = p.prezzo;
  const oggetto = encodeURIComponent('Ordine ' + p.nome + ' - WEINERVILLE');
  const corpo = encodeURIComponent('Ciao! Vorrei ordinare il ' + p.nome + ' (' + p.prezzo.replace('\u20ac','EUR') + ').\n\nNome e cognome:\nIndirizzo di spedizione:\nTelefono:');
  document.getElementById('scheda-compra').href = 'mailto:' + EMAIL + '?subject=' + oggetto + '&body=' + corpo;
  galleria.innerHTML = p.foto.map(f => '<img src="' + f + '" alt="">').join('');
  pallini.innerHTML = p.foto.map((_, j) => '<i' + (j === 0 ? ' class="on"' : '') + '></i>').join('');
  pallini.style.display = p.foto.length > 1 ? 'flex' : 'none';
  galleria.scrollLeft = 0;
  const altri = document.getElementById('scheda-altri');
  altri.innerHTML = '';
  PEZZI.forEach((q, j) => {
    if (j === i) return;
    const a = document.createElement('article');
    a.className = 'capo';
    a.innerHTML = '<div class="slideshow"><div class="slide attiva"><img class="foto" loading="lazy" src="' + q.foto[0] + '" alt="' + q.nome + '"></div>' +
                  '<div class="capo-info"><h2 class="capo-nome">' + q.nome + '</h2><span class="capo-prezzo">' + q.prezzo + '</span></div></div>';
    a.addEventListener('click', () => { apriScheda(j); scheda.scrollTop = 0; });
    altri.appendChild(a);
  });
  scheda.scrollTop = 0;
  apriSchermata('scheda');
}
galleria.addEventListener('scroll', () => {
  const idx = Math.round(galleria.scrollLeft / galleria.clientWidth);
  pallini.querySelectorAll('i').forEach((p, j) => p.classList.toggle('on', j === idx));
}, {passive:true});

/* ---- POPUP ---- */
const popup = document.getElementById('popup');
function righeHTML(righe){
  return '<div class="popup-righe">' + righe.map(r => '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>').join('') + '</div>';
}
function apriPopup(tipo){
  const p = PEZZI[pezzoAperto];
  let titolo = '', html = '';
  if (tipo === 'descrizione'){
    titolo = 'Descrizione';
    html = '<div class="popup-testo">' + p.descrizione.map(t => '<p>' + t + '</p>').join('') + '</div>';
  } else if (tipo === 'misure'){
    titolo = 'Misure';
    html = righeHTML(p.misure) +
      '<a class="popup-nota" href="mailto:' + EMAIL + '?subject=' + encodeURIComponent('Domanda taglia ' + p.nome) + '">Dubbi sulla taglia? Scrivici \u2192</a>';
  } else if (tipo === 'spedizione'){
    titolo = 'Spedizione e resi';
    html = righeHTML(SPEDIZIONE) +
      '<span class="popup-nota">Il pezzo torna nelle stesse condizioni in cui lo hai ricevuto</span>';
  } else if (tipo === 'pagamenti'){
    titolo = 'Metodi di pagamento';
    html = righeHTML(PAGAMENTI) +
      '<span class="popup-nota">Pagamento sicuro \u00b7 i dati non vengono mai salvati sul sito</span>';
  }
  document.getElementById('popup-titolo').textContent = titolo;
  document.getElementById('popup-contenuto').innerHTML = html;
  popup.classList.add('aperto');
}
function chiudiPopup(){ popup.classList.remove('aperto'); }
document.querySelectorAll('[data-popup]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); apriPopup(b.dataset.popup); }));
document.querySelector('.popup-chiudi').addEventListener('click', chiudiPopup);
popup.addEventListener('click', e => { if (e.target === popup) chiudiPopup(); });
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (popup.classList.contains('aperto')) chiudiPopup();
  else if (scheda.classList.contains('aperta')) chiudiSchermata('scheda');
  else chiudiSchermata('catalogo');
});
</script>
